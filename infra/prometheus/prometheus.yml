global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: outbox-arena-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'host.docker.internal:8081'   # order-service
          - 'host.docker.internal:8082'   # payment-service
          - 'host.docker.internal:8083'   # inventory-service
          - 'host.docker.internal:8084'   # shipping-service
          - 'host.docker.internal:8095'   # projection-service
          - 'host.docker.internal:8086'   # notifier-sink
    relabel_configs:
      - source_labels: [__address__]
        regex: '.*:(\d+)'
        target_label: instance_port
