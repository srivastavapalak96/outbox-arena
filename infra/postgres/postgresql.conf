# Postgres config tuned for outbox-arena.
# The single non-default knob that matters: wal_level=logical, required by Debezium's pgoutput plugin.
# Everything else stays close to Postgres 16 defaults for portfolio readability.

listen_addresses = '*'
port = 5432
max_connections = 200

# Logical replication for Debezium CDC.
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10

# Modest tuning for laptop workloads.
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB

# Logging.
log_destination = 'stderr'
log_line_prefix = '%t [%p] %u@%d '
log_statement = 'none'
log_min_duration_statement = 250

# Standard.
timezone = 'UTC'
datestyle = 'iso, mdy'
