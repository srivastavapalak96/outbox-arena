apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/srivastavapalak96/outbox-arena/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - { name: PAYMENT_DB_URL,      value: jdbc:postgresql://postgres:5432/payment_svc }
            - { name: PAYMENT_DB_USER,     value: payment_svc }
            - { name: PAYMENT_DB_PASSWORD, value: payment_svc }
            - { name: KAFKA_BOOTSTRAP,     value: outbox-arena-kafka-kafka-bootstrap:9092 }
            - { name: SERVER_PORT,         value: "8082" }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8082 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /actuator/health, port: 8082 }, initialDelaySeconds: 30 }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: 500m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
spec:
  ports: [{ port: 8082, targetPort: 8082, name: http }]
  selector:
    app.kubernetes.io/name: payment-service
