apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: ghcr.io/srivastavapalak96/outbox-arena/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8083, name: http }]
          env:
            - { name: INVENTORY_DB_URL,      value: jdbc:postgresql://postgres:5432/inventory_svc }
            - { name: INVENTORY_DB_USER,     value: inventory_svc }
            - { name: INVENTORY_DB_PASSWORD, value: inventory_svc }
            - { name: KAFKA_BOOTSTRAP,       value: outbox-arena-kafka-kafka-bootstrap:9092 }
            - { name: SERVER_PORT,           value: "8083" }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8083 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /actuator/health, port: 8083 }, initialDelaySeconds: 30 }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: 500m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
spec:
  ports: [{ port: 8083, targetPort: 8083, name: http }]
  selector:
    app.kubernetes.io/name: inventory-service
