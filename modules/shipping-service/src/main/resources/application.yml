spring:
  application:
    name: shipping-service
  datasource:
    url: ${SHIPPING_DB_URL:jdbc:postgresql://localhost:5432/shipping_svc}
    username: ${SHIPPING_DB_USER:shipping_svc}
    password: ${SHIPPING_DB_PASSWORD:shipping_svc}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: shipping-service
      properties:
        isolation.level: read_committed

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
