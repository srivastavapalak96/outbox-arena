spring:
  application:
    name: projection-service
  datasource:
    url: ${PROJECTION_DB_URL:jdbc:postgresql://localhost:5432/projection_svc}
    username: ${PROJECTION_DB_USER:projection_svc}
    password: ${PROJECTION_DB_PASSWORD:projection_svc}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: projection-service
      properties:
        isolation.level: read_committed
      auto-offset-reset: earliest

outbox-arena:
  outbox:
    # projection-service has no outbox table; never poll.
    enabled: false

server:
  # Note: 8085 was the original plan but collides with a common host-side container
  # binding in this dev environment. 8095 keeps the mnemonic 80nn-by-service close.
  port: 8095

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
